<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa898"/>
      <stop offset="100%" stop-color="#7c9584"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- counter ledge -->
  <rect x="0" y="380" width="512" height="132" fill="#5c6b63"/>
  <rect x="0" y="372" width="512" height="12" fill="#46524b"/>

  <!-- "now serving" plate -->
  <rect x="150" y="410" width="212" height="60" rx="6" fill="#1c231f"/>
  <text x="256" y="452" font-family="Courier New, monospace" font-size="34" font-weight="700" fill="#ff5b45" text-anchor="middle">A-047</text>

  <!-- cat body -->
  <g>
    <!-- ears -->
    <polygon points="150,150 190,90 220,160" fill="#d98a3d"/>
    <polygon points="362,150 322,90 292,160" fill="#d98a3d"/>
    <polygon points="160,150 188,110 208,158" fill="#b8672a"/>
    <polygon points="352,150 324,110 304,158" fill="#b8672a"/>

    <!-- head -->
    <circle cx="256" cy="220" r="120" fill="#e29a4a"/>

    <!-- stripes -->
    <path d="M256 105 L256 155" stroke="#b8672a" stroke-width="10" stroke-linecap="round"/>
    <path d="M190 120 L205 160" stroke="#b8672a" stroke-width="10" stroke-linecap="round"/>
    <path d="M322 120 L307 160" stroke="#b8672a" stroke-width="10" stroke-linecap="round"/>

    <!-- eyes: unbothered, half-lidded -->
    <path d="M195 215 Q215 200 235 215" stroke="#2b2822" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M277 215 Q297 200 317 215" stroke="#2b2822" stroke-width="9" fill="none" stroke-linecap="round"/>

    <!-- nose -->
    <polygon points="246,248 266,248 256,262" fill="#8a4a2b"/>

    <!-- mouth: flat, unimpressed -->
    <path d="M230 275 Q256 285 282 275" stroke="#2b2822" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- whiskers -->
    <path d="M150 250 L90 240" stroke="#2b2822" stroke-width="5" stroke-linecap="round"/>
    <path d="M150 265 L90 268" stroke="#2b2822" stroke-width="5" stroke-linecap="round"/>
    <path d="M362 250 L422 240" stroke="#2b2822" stroke-width="5" stroke-linecap="round"/>
    <path d="M362 265 L422 268" stroke="#2b2822" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- DMV vest -->
  <path d="M170 330 Q256 300 342 330 L342 400 L170 400 Z" fill="#3d5a7a"/>
  <rect x="240" y="330" width="32" height="70" fill="#e3c88a"/>
  <text x="256" y="380" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#2b2822" text-anchor="middle">DMV</text>

  <!-- name badge bottom -->
  <rect x="0" y="460" width="512" height="52" fill="#1c231f"/>
  <text x="256" y="495" font-family="Courier New, monospace" font-size="26" font-weight="700" fill="#f2ede0" text-anchor="middle" letter-spacing="2">$DMVCAT</text>
</svg>
